name: calculator

services:
  calculator:
    build: .
    image: ${IMAGE_NAME:-calculator-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: "9090"
    expose:
      - "9090"   # visible to containers on calc-net only
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - calc-net

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "9090:80"   # host:container. Nginx is the only public entry point
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge